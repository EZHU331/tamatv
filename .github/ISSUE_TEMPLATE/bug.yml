name: Bug
description: Something in tamaTV is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Apple TV
        - iPhone
        - iPad
        - Mac
        - More than one
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Do not include passwords, cookies, or session QR codes.
      placeholder: What you did, what you expected, what you saw.
    validations:
      required: true
